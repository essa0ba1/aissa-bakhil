
name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r tools/requirements.txt

      - name: Generate blog pages
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"

          python tools/build_blogs.py \
            --base-path "/${REPO_NAME}/" \
            --site-url "$SITE_URL"

      - name: Build Flet website
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          flet build web \
            --yes \
            --base-url "$REPO_NAME" \
            --route-url-strategy hash

          touch build/web/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
